name: Growth Ops — Decay Sentinel, Rank Track, Competitor Gap, Entity Backfill, WP Engine & Evaluator

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC — Decay Sentinel, Rank Track, Competitor Gap, Entity Backfill
    - cron: "0 6 * * 3" # Wednesdays 06:00 UTC — WordPress Discovery & Authority Injection
    - cron: "0 7 * * 5" # Fridays 07:00 UTC — Growth Evaluator Outcome Measurement & Telegram Digest
    - cron: "0 4 * * 0" # Sundays 04:00 UTC — Weekly Community Poll Generator
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, no DB writes"
        required: false
        default: "false"
        type: boolean
      job_name:
        description: "Specific job to run (all, decay, gap, rank, entity, wp, eval, poll)"
        required: false
        default: "all"
        type: string

concurrency:
  group: growth-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decay-sentinel:
    name: GSC Decay → Refresh Queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '0 5 * * 1' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Decay Sentinel
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FOUNDER_CHAT_ID: ${{ secrets.TELEGRAM_FOUNDER_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python agents/decay_sentinel.py --dry-run
          else
            python agents/decay_sentinel.py
          fi

  competitor-gap:
    name: SERP Hijack Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.schedule == '0 5 * * 1' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Competitor Gap Scan
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python agents/competitor_gap.py --dry-run
          else
            python agents/competitor_gap.py
          fi

  rank-tracking:
    name: GSC Rank Positions → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.schedule == '0 5 * * 1' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Rank Tracker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GSC_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python agents/rank_tracker.py --dry-run --top-kw 50
          else
            python agents/rank_tracker.py --top-kw 50
          fi

  entity-graph-backfill:
    name: Entity Knowledge Graph Backfill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.schedule == '0 5 * * 1' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Entity Backfill
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python agents/entity_backfill.py --limit 100 --dry-run
          else
            python agents/entity_backfill.py --limit 100
          fi

  wordpress-discovery:
    name: WP Target Discovery (wordpress_hunter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.schedule == '0 6 * * 3' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run WordPress Hunter
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python agents/wordpress_hunter.py --pillar all --limit 20 --seed-only

  wordpress-injection:
    name: WP Authority Link Injection
    runs-on: ubuntu-latest
    needs: wordpress-discovery
    timeout-minutes: 20
    if: github.event.schedule == '0 6 * * 3' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run WordPress Injector
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WP_COMMENT_EMAIL: ${{ secrets.WP_COMMENT_EMAIL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python agents/wordpress_injector.py --limit 5 --dry-run
          else
            python agents/wordpress_injector.py --limit 5
          fi

  growth-evaluation:
    name: Growth OS Outcome Evaluation + Learning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.schedule == '0 7 * * 5' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Growth Evaluator
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FOUNDER_CHAT_ID: ${{ secrets.TELEGRAM_FOUNDER_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python agents/growth_evaluator.py --all --dry-run
          else
            python agents/growth_evaluator.py --all
          fi

  poll-generation:
    name: Weekly Community Poll Generator (1 per pillar)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '0 4 * * 0' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Poll Generator
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python agents/poll_generator.py --dry-run
          else
            python agents/poll_generator.py
          fi
