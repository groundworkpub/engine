name: X Growth Ops
# ARCHIVED 2026-09-19: disabled schedule due to x.com ERR_TIMED_OUT in headless CI environment.
# Use workflow_dispatch to trigger manually with a valid session cookie.

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "Which cycle to run"
        required: true
        default: "replies"
        type: choice
        options:
          - replies
          - discover
      live:
        description: "Execute real writes (unchecked = dry-run)"
        required: false
        default: false
        type: boolean

concurrency:
  group: x-growth
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-x-ops:
    name: ${{ github.event.inputs.cycle == 'discover' && 'Discovery & follow cycle' || 'Reply & mention cycle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r agents/requirements.txt
          playwright install chromium --with-deps

      - name: Run X ops cycle
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LITELLM_LOG: WARNING
        run: |
          CYCLE="${{ github.event.inputs.cycle }}"
          if [ "$CYCLE" != "discover" ]; then CYCLE="replies"; fi
          FLAGS=""
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            FLAGS="--live"
          fi
          PYTHONPATH=agents python agents/x_ops.py "--$CYCLE" $FLAGS

      - name: Notify on failure
        if: failure()
        run: echo "X ops failed at $(date -u) — check logs above."
