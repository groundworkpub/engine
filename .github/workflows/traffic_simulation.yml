name: Organic Discovery & Traffic Simulation

on:
  schedule:
    - cron: "0 */4 * * *" # Every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC (6x daily)
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of targets to simulate per shard"
        required: false
        default: "3"
      allow_ga4:
        description: "Allow GA4 & GTM network requests (AdSense remains 100% blocked)"
        required: false
        default: "false"
      slug:
        description: "Target specific article slug (optional)"
        required: false
        default: ""
      channel:
        description: "Force specific channel (google_search, competitor_switch, tier2_buffer, direct, youtube_gworky)"
        required: false
        default: ""
      run_brand_booster:
        description: "Execute Stage 1: Brand Keyword Booster (search-only queries)"
        required: false
        default: "true"
      run_rank_adaptive:
        description: "Execute Rank-Adaptive Behavioral Controller (SERP triangulation; founder-approved by design)"
        required: false
        default: "true"

concurrency:
  group: traffic-simulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Let current run finish, skip overlap

permissions:
  contents: read

jobs:
  simulate-organic-traffic:
    name: Run 3-Shard Traffic & Brand Discovery Engine (${{ matrix.runner_shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        runner_shard: [1, 2, 3]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agents/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt
          playwright install --with-deps chromium

      - name: Stage 1 — Brand Keyword Booster (Search-Only)
        if: ${{ (github.event.inputs.run_brand_booster == 'true' || github.event_name == 'schedule') && matrix.runner_shard == 1 }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_EGRESS_WORKER_URL: ${{ secrets.CLOUDFLARE_EGRESS_WORKER_URL }}
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          echo "🚀 Shard ${{ matrix.runner_shard }}: Executing Stage 1 Brand Keyword Booster across Google Autocomplete & DuckDuckGo"
          PYTHONPATH=agents python agents/brand_booster.py --limit 5

      - name: Stage 2 — Organic Browser Simulator (Retention, Multi-Hop & Tool Engagement)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://gworky.com
          CLOUDFLARE_EGRESS_WORKER_URL: ${{ secrets.CLOUDFLARE_EGRESS_WORKER_URL }}
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          echo "🚀 Shard ${{ matrix.runner_shard }}/3: Executing Stage 2 Organic Browser Engagement Simulator"
          GA4_FLAG=""
          if [ "${{ github.event.inputs.allow_ga4 }}" = "true" ]; then
            GA4_FLAG="--allow-ga4"
          fi

          SLUG_FLAG=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            SLUG_FLAG="--slug ${{ github.event.inputs.slug }}"
          fi

          CHANNEL_FLAG=""
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            CHANNEL_FLAG="--channel ${{ github.event.inputs.channel }}"
          fi

          LIMIT="${{ github.event.inputs.limit || '3' }}"
          PYTHONPATH=agents python agents/organic_simulator.py --browser --limit "$LIMIT" --shard ${{ matrix.runner_shard }} --total-shards 3 $GA4_FLAG $SLUG_FLAG $CHANNEL_FLAG

      - name: Stage 3 — Rank-Adaptive Controller (Founder-Approved SERP Triangulation)
        if: ${{ (github.event.inputs.run_rank_adaptive == 'true' || github.event_name == 'schedule') && matrix.runner_shard == 1 }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://gworky.com
          CLOUDFLARE_EGRESS_WORKER_URL: ${{ secrets.CLOUDFLARE_EGRESS_WORKER_URL }}
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
        run: |
          echo "🚀 Shard 1: Executing Stage 3 Rank-Adaptive Behavioral Controller"
          PYTHONPATH=agents python agents/rank_adaptive_controller.py --dry-run
