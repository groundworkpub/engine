name: Organic Discovery & Traffic Simulation

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of targets to simulate"
        required: false
        default: "2"
      allow_ga4:
        description: "Allow GA4 & GTM network requests (AdSense remains 100% blocked)"
        required: false
        default: "true"
      slug:
        description: "Target specific article slug (optional)"
        required: false
        default: ""
      channel:
        description: "Force specific channel (google_search, competitor_switch, tier2_buffer, direct, youtube_gworky)"
        required: false
        default: ""
      run_brand_booster:
        description: "Execute Stage 1: Brand Keyword Booster (search-only queries)"
        required: false
        default: "true"

concurrency:
  group: traffic-simulation
  cancel-in-progress: false # Let current run finish, skip overlap

permissions:
  contents: read

jobs:
  simulate-organic-traffic:
    name: Run Dual-Stage Traffic & Brand Discovery Engine
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agents/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt
          playwright install --with-deps chromium

      - name: Stage 1 — Brand Keyword Booster (Search-Only)
        if: ${{ github.event.inputs.run_brand_booster == 'true' || github.event_name == 'schedule' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
        run: |
          echo "🚀 Executing Stage 1: Brand Keyword Booster across Google Autocomplete, DuckDuckGo & SearXNG"
          PYTHONPATH=agents python agents/brand_booster.py --limit 5

      - name: Stage 2 — Organic Browser Simulator (Retention & Tool Engagement)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://gworky.com
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
        run: |
          echo "🚀 Executing Stage 2: Organic Browser Engagement Simulator"
          GA4_FLAG="--allow-ga4"
          if [ "${{ github.event.inputs.allow_ga4 }}" = "false" ]; then
            GA4_FLAG=""
          fi

          SLUG_FLAG=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            SLUG_FLAG="--slug ${{ github.event.inputs.slug }}"
          fi

          CHANNEL_FLAG=""
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            CHANNEL_FLAG="--channel ${{ github.event.inputs.channel }}"
          fi

          LIMIT="${{ github.event.inputs.limit || '2' }}"
          PYTHONPATH=agents python agents/organic_simulator.py --browser --limit "$LIMIT" $GA4_FLAG $SLUG_FLAG $CHANNEL_FLAG
