name: Organic Discovery & Traffic Simulation

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of targets to simulate"
        required: false
        default: "5"
      channel:
        description: "Force specific channel (google_search, youtube_gworky, topic_silo)"
        required: false
        default: ""

concurrency:
  group: traffic-simulation
  cancel-in-progress: false # Let current run finish, skip overlap

permissions:
  contents: read

jobs:
  simulate-organic-traffic:
    name: Run Organic Engagement & Discovery Simulator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agents/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt

      - name: Execute Organic Simulation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://gworky.com
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
        run: |
          CHANNEL_FLAG=""
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            CHANNEL_FLAG="--channel ${{ github.event.inputs.channel }}"
          fi
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          PYTHONPATH=agents python agents/organic_simulator.py --limit "$LIMIT" $CHANNEL_FLAG
