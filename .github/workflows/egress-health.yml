name: Egress Mesh Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egress-health:
    name: Test and Audit Egress Proxy Routes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt

      - name: Check Egress Routes
        env:
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
          SIMULATOR_PROXY_URL: ${{ secrets.SIMULATOR_PROXY_URL }}
        run: |
          python -m agents.cli egress test
