name: Egress Mesh Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egress-health:
    name: Test and Audit Egress Proxy Routes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt

      - name: Check Egress Routes
        env:
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
          SIMULATOR_PROXY_URL: ${{ secrets.SIMULATOR_PROXY_URL }}
        run: |
          python -m agents.cli egress test
