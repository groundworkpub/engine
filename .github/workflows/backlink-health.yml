name: Backlink Health — Weekly Registry & Live-URL Monitor

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC — after Link Watch (07:00), weekly health sweep
  workflow_dispatch:
    inputs:
      check_recent:
        description: "Number of recent backlinks to probe"
        required: false
        default: "25"
        type: string

concurrency:
  group: backlink-health
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-health:
    name: Probe live backlinks & refresh registry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Probe recent backlinks
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: PYTHONPATH=. python agents/backlink_monitor.py --check-recent ${{ github.event.inputs.check_recent || '25' }}

      - name: Export fresh registry
        id: export
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: PYTHONPATH=. python agents/backlink_monitor.py --export-registry output/backlink_registry.md

      - name: Commit refreshed registry
        run: |
          git config user.name "groundwork-bot"
          git config user.email "groundwork-bot@users.noreply.github.com"
          git add output/backlink_registry.md
          if git diff --cached --quiet; then
            echo "No registry change"
          else
            git commit -m "chore(backlink): refresh weekly registry [skip ci]"
            git push
          fi