name: GitHub.io Freshness — Daily Discover Signal

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC daily — refresh dateModified + feed lastBuild (Discover freshness)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Update dateModified + feed lastBuildDate (719 guides)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout github.io
        uses: actions/checkout@v4
        with:
          repository: groundworkpub/groundworkpub.github.io
          token: ${{ secrets.GITHUB_SATELLITE_TOKEN }}
          path: ghio

      - name: Refresh freshness
        run: |
          cd ghio
          TODAY=$(date -u +%Y-%m-%d)
          NOW=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          # Update dateModified on all NewsArticle pages
          find . -name index.html -exec sed -i -E 's/"dateModified": "[0-9-]+"/"dateModified": "'"$TODAY"'"/g' {} +
          # Update feed lastBuildDate
          sed -i -E "s|<lastBuildDate>.*</lastBuildDate>|<lastBuildDate>$NOW</lastBuildDate>|g" feed.xml
          # Update article:modified_time meta
          find . -name index.html -exec sed -i -E 's|<meta property="article:modified_time" content="[^"]*">|<meta property="article:modified_time" content="'"$TODAY"'">|g' {} +

      - name: Commit + push
        run: |
          cd ghio
          git config user.name "groundwork-bot"
          git config user.email "groundwork-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — already fresh"; exit 0
          fi
          git commit -m "chore(freshness): dateModified+lastBuildDate ${TODAY} [skip ci]"
          git push origin main

      - name: Telegram notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_FOUNDER_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🆕 GitHub.io Discover freshness updated (${TODAY}): 719 NewsArticle dateModified + feed lastBuildDate" \
            -d parse_mode="HTML"
