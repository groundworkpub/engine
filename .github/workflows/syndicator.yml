name: Authority Engine & Syndication (3-Tier Backlinks)

on:
  schedule:
    - cron: "0 4,16 * * *" # 2x daily automated syndication (preserves quota)
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of articles to syndicate"
        required: false
        default: "5"

concurrency:
  group: authority-syndicator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  syndicate:
    name: 3-Tier Multi-Platform Syndication & GitHub Pages Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install Dependencies
        run: pip install -r agents/requirements.txt

      - name: Run 3-Tier Authority Syndication (Dev.to + Blogger + IndexNow)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SITE_URL: "https://gworky.com"
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BLOGGER_EMAIL: "groundworkpub.gworky@blogger.com"
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LITELLM_LOG: WARNING
        run: |
          python -m agents.cli authority batch-all --limit=${{ github.event.inputs.limit || '5' }}

      - name: Sync GitHub Pages Whitepaper Portal (DR 96)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: "https://gworky.com"
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          python -m agents.cli authority sync-github-pages --limit=50 || echo "GitHub Pages sync completed with notice."
