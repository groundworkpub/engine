name: Jobs Pipeline

on:
  schedule:
    - cron: "0 6,18 * * *" # 2x daily (preserves quota)
  workflow_dispatch:

concurrency:
  group: jobs-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-jobs-pipeline:
    name: Scouter → Critic → Upsert
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Jobs Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SITE_URL: https://gworky.com
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BING_WEBMASTER_KEY: ${{ secrets.BING_WEBMASTER_KEY }}
          GSC_WEBHOOK_URL: ${{ secrets.GSC_WEBHOOK_URL }}
          GSC_WEBHOOK_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: PYTHONPATH=. python agents/jobs_pipeline.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "Jobs pipeline failed! Check the logs above."
          echo "Run at: $(date -u)"
