name: Community Growth Sniper

on:
  schedule:
    - cron: "0 */4 * * *" # Every 4 hours
  workflow_dispatch: # Manual trigger from GitHub UI or CLI

concurrency:
  group: community-sniper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-community-sniper:
    name: Community Radar & Copilot Dispatcher (Reddit / Quora / X)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Community Sniper
        env:
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_FOUNDER_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=. python agents/community_sniper.py --scan --notify-telegram --limit 8
