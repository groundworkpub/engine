name: WordPress Authority Growth Engine

# Decommissioned 2026-09-03: WordPress satellite link building retired
# Manual workflow_dispatch only for archival/testing purposes.
on:
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Pillar to hunt and inject (money, body, home, life, tech, all)'
        required: false
        default: 'all'
      limit:
        description: 'Number of targets to process'
        required: false
        default: '5'
      dry_run:
        description: 'Dry run mode (no network submissions)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wordpress-growth:
    name: WordPress Authority Injection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 psycopg2-binary python-dotenv

      - name: Sync Target Seed Matrix
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python agents/wordpress_hunter.py --seed-only

      - name: Probe Capabilities & Hunt Targets
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
        run: |
          python agents/wordpress_hunter.py --probe --pillar ${{ github.event.inputs.pillar || 'all' }} --limit ${{ github.event.inputs.limit || '5' }}

      - name: Execute Contextual Injections (Tier 2 Buffer)
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
        run: |
          DRY_RUN_FLAG="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          python agents/wordpress_injector.py --pillar ${{ github.event.inputs.pillar || 'money' }} --limit ${{ github.event.inputs.limit || '3' }} $DRY_RUN_FLAG

      - name: Display Summary Stats
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python agents/wordpress_hunter.py --stats
