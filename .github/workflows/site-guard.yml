name: Site Guard — Injection Watch

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC, off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run injection watch (outside-only, read-only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FOUNDER_CHAT_ID: ${{ secrets.TELEGRAM_FOUNDER_CHAT_ID }}
          SITE_GUARD_BASE_URL: https://gworky.com
        run: |
          cd agents
          python site_guard.py --sample 30
