name: Autonomous pSEO Pipeline Engine Cron

# Single Source of Truth: Automated pSEO Scouting & Template Synthesis for Groundwork
# This workflow runs in groundworkpub/engine (public repo, unlimited free minutes)
# and evaluates search queries across 5 pillars, tests SERP weakness, and generates decision utilities.

on:
  schedule:
    # Run every Wednesday and Sunday at 04:00 UTC
    - cron: "0 4 * * 0,3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no DB writes)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: pseo-pipeline-sync
  cancel-in-progress: true

jobs:
  run-pseo-engine:
    name: Autonomous pSEO Engine Runner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout media repository
        uses: actions/checkout@v4
        with:
          repository: groundworkpub/media
          token: ${{ secrets.GH_PAT_MEDIA || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx supabase pyyaml

      - name: Execute Autonomous pSEO Pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FOUNDER_CHAT_ID: ${{ secrets.TELEGRAM_FOUNDER_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            python agents/pseo_pipeline.py --dry-run
          else
            python agents/pseo_pipeline.py
          fi
