# This workflow runs in groundworkpub/engine (public repo, unlimited free minutes)
# Schedule: Daily at 05:30 UTC (12:30 WIB) — before peak US/UK morning crawl cycles
# Purpose: Keep 700+ NewsArticle dateModified and RSS feed lastBuildDate fresh on groundworkpub.github.io

name: Groundwork Discover Freshness Keeper (ghio)

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force freshness update regardless of git diff"
        type: boolean
        default: true

jobs:
  update-ghio-freshness:
    name: Sync dateModified & RSS lastBuildDate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout ghio repository
        uses: actions/checkout@v4
        with:
          repository: groundworkpub/groundworkpub.github.io
          token: ${{ secrets.GH_PAGES_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: ghio

      - name: Update Freshness Timestamps
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RFC822=$(date -u +"%a, %d %b %Y %H:%M:%S GMT")
          
          echo "Updating ghio freshness timestamps to $NOW ($RFC822)..."
          
          # Update dateModified in Schema.org JSON-LD and OpenGraph modified_time across all HTML pages
          # Note: Linux sed requires -i without empty string argument
          find ghio -name "*.html" -exec sed -i -E \
            -e "s|\"dateModified\": \"[^\"]*\"|\"dateModified\": \"${NOW}\"|g" \
            -e "s|<meta property=\"article:modified_time\" content=\"[^\"]*\">|<meta property=\"article:modified_time\" content=\"${NOW}\">|g" {} +
          
          # Update lastBuildDate in RSS and Atom feeds
          for feed in ghio/feed.xml ghio/rss.xml ghio/atom.xml; do
            if [ -f "$feed" ]; then
              sed -i -E "s|<lastBuildDate>[^<]*</lastBuildDate>|<lastBuildDate>${RFC822}</lastBuildDate>|g" "$feed"
            fi
          done

      - name: Commit & Push Changes
        id: commit_push
        run: |
          cd ghio
          git config user.name "groundwork-bot"
          git config user.email "groundwork-bot@users.noreply.github.com"
          git add -A
          
          if git diff --cached --quiet; then
            echo "No changes — repository is already fresh."
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          TODAY=$(date -u +"%Y-%m-%d")
          ARTICLE_COUNT=$(find . -name "*.html" ! -name "index.html" ! -name "404.html" | wc -l | tr -d ' ')
          
          git commit -m "chore(freshness): dateModified+lastBuildDate ${TODAY} [skip ci]"
          git push origin main
          
          echo "updated=true" >> $GITHUB_OUTPUT
          echo "count=${ARTICLE_COUNT}" >> $GITHUB_OUTPUT
          echo "today=${TODAY}" >> $GITHUB_OUTPUT

      - name: Telegram Notification
        if: steps.commit_push.outputs.updated == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_FOUNDER_CHAT_ID }}
        run: |
          COUNT="${{ steps.commit_push.outputs.count || '700+' }}"
          DATE="${{ steps.commit_push.outputs.today || 'today' }}"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚡ <b>Discover Freshness Keeper:</b> Successfully updated <b>${COUNT}</b> NewsArticle <code>dateModified</code> and RSS <code>lastBuildDate</code> for <b>${DATE}</b> on <code>groundworkpub.github.io</code>." \
            -d parse_mode="HTML"
