name: Autonomous Market Miner Trend Harvester

# Single Source of Truth: Automated Market Mining & Keyword Discovery Engine for Groundwork
# This workflow runs in groundworkpub/engine (public repo, unlimited free minutes)
# Executes every 4 hours across all 5 pillars (Money, Body, Home, Life, Tech).
# Harvests high-intent trending queries across Google/Bing autocomplete, PAA, arXiv, Reddit.
# Persists validated TokenlessKeywordMatrix into Supabase and sends breakout alerts to Telegram.

on:
  schedule:
    # Run every 4 hours at the top of the hour (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      pillar:
        description: "Filter extraction by pillar (all, money, body, home, life, tech)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - money
          - body
          - home
          - life
          - tech
      limit:
        description: "Number of query variants per seed/vector"
        required: false
        default: "5"
        type: string
      dry_run:
        description: "Run in dry-run mode without DB mutations"
        required: false
        default: false
        type: boolean

concurrency:
  group: market-miner-engine
  cancel-in-progress: true

jobs:
  harvest-trends:
    name: Autonomous Market Miner Runner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout media repository
        uses: actions/checkout@v4
        with:
          repository: groundworkpub/media
          token: ${{ secrets.GH_PAT_MEDIA || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx supabase pydantic requests pyyaml python-dotenv

      - name: Execute Autonomous Market Miner
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PILLAR="${{ github.event.inputs.pillar || 'all' }}"
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          DRY_RUN="${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}"
          python agents/market_miner.py --pillar "$PILLAR" --limit "$LIMIT" $DRY_RUN

      - name: Send Failure Notification to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="Markdown" \
              -d text="⚠️ *Market Miner Engine Failed!*%0AWorkflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
