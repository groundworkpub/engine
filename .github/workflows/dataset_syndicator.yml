name: Groundwork Open Research Dataset Syndicator

# Single Source of Truth: Automated Dataset Syndication for Groundwork
# This workflow runs in groundworkpub/engine (public repo, unlimited free minutes)
# and synchronizes open research datasets across 5 pillars to Hugging Face Hub (DR 92 backlink anchor).

on:
  schedule:
    # Run daily at 04:00 UTC (11:00 WIB) after the Content Pipeline finishes
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      pillar:
        description: "Pillar to syndicate (all, money, body, home, life, tech)"
        required: false
        default: "all"
      dry_run:
        description: "Run in dry-run mode (no upload to Hugging Face)"
        required: false
        default: "false"

concurrency:
  group: dataset-syndication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  syndicate-datasets:
    name: Syndicate Research Datasets to Hugging Face Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout media repository
        uses: actions/checkout@v4
        with:
          repository: groundworkpub/media
          token: ${{ secrets.GH_PAT_MEDIA || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx supabase huggingface_hub pyyaml

      - name: Execute Dataset Syndicator
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          PILLAR="${{ github.event.inputs.pillar || 'all' }}"
          if [ "$PILLAR" = "all" ]; then
            python -m agents.dataset_syndicator --all $DRY_RUN_FLAG
          else
            python -m agents.dataset_syndicator --pillar "$PILLAR" $DRY_RUN_FLAG
          fi
