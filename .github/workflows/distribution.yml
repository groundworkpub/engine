name: Federated Authority & Content Distribution

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of articles to distribute"
        required: false
        default: "5"
      slug:
        description: "Specific article slug to distribute"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  federated-distribution:
    name: Run Federated Multi-Channel Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt

      - name: Execute Distribution Pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://gworky.com
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          PINTEREST_API_KEY: ${{ secrets.PINTEREST_API_KEY }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          WAYBACK_S3_ACCESS_KEY: ${{ secrets.WAYBACK_S3_ACCESS_KEY }}
          WAYBACK_S3_SECRET_KEY: ${{ secrets.WAYBACK_S3_SECRET_KEY }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            python -m agents.cli distribution all --slug "${{ github.event.inputs.slug }}"
          else
            LIMIT="${{ github.event.inputs.limit || '5' }}"
            python -m agents.cli distribution all --batch-all --limit "$LIMIT"
          fi
