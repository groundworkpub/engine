name: Notify Telegram on Workflow Failure

on:
  workflow_run:
    workflows: ["*"]
    types:
      - completed

permissions:
  contents: read

jobs:
  notify-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Telegram failure alert
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_FOUNDER_CHAT_ID }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          MSG="❌ *Groundwork Engine workflow failure*%0AWorkflow: ${WF_NAME}%0ABranch: ${BRANCH}%0ARun: [#${{ github.event.workflow_run.run_number }}](${WF_URL})"
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" >/dev/null
