name: Macro Rates & FRED Data Sync Cron

# Single Source of Truth: Automated macro data sync for Groundwork
# This workflow runs in groundworkpub/engine (public repo, unlimited free minutes)
# and pushes the updated public/data/macro-rates.json to groundworkpub/media.

on:
  schedule:
    # Run every Monday at 06:00 UTC (01:00 AM EST)
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: macro-rates-sync
  cancel-in-progress: true

jobs:
  sync-macro-rates:
    name: Sync FRED & Treasury Rates to Media Repo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout media repository
        uses: actions/checkout@v7
        with:
          repository: groundworkpub/media
          token: ${{ secrets.GH_PAT_MEDIA || secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Fetch live macroeconomic rates
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/fetch_macro_rates.py

      - name: Check for data changes
        id: git_diff
        run: |
          git status --porcelain public/data/macro-rates.json
          if [ -n "$(git status --porcelain public/data/macro-rates.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated macro rates
        if: steps.git_diff.outputs.changed == 'true'
        run: |
          git config user.name "Groundwork Engine Bot"
          git config user.email "bot@gworky.com"
          git add public/data/macro-rates.json
          git commit -m "chore(data): auto-update live macro rates and yield curve [skip ci]"
          git push origin main

      - name: Purge Cloudflare Edge Cache for macro-rates.json
        if: steps.git_diff.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || '67e2be0fcddb82637428c64471050fd8' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare token not set, skipping cache purge."
            exit 0
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://gworky.com/data/macro-rates.json"]}'

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FOUNDER_CHAT_ID: ${{ secrets.TELEGRAM_FOUNDER_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_FOUNDER_CHAT_ID" ]; then
            echo "Telegram credentials not set, skipping notification."
            exit 0
          fi
          STATUS="${{ job.status }}"
          CHANGED="${{ steps.git_diff.outputs.changed }}"
          MESSAGE="📊 <b>Groundwork Macro Rates Sync</b>%0AStatus: <b>${STATUS}</b>%0AData Changed: <b>${CHANGED}</b>%0ARef: <code>groundworkpub/media:main</code>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_FOUNDER_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"
