name: Macro Rates & FRED Data Sync Cron

# SSOT: All automated recurring crons live in groundworkpub/engine (public repo, unlimited minutes)
# This workflow syncs FRED Treasury/macro rates into groundworkpub/media's public/data/ directory.

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: macro-rates-sync
  cancel-in-progress: true

jobs:
  sync-macro-rates:
    name: Sync FRED Rates to Media
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout media repository
        uses: actions/checkout@v4
        with:
          repository: groundworkpub/media
          token: ${{ secrets.MEDIA_CI_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Fetch live macroeconomic rates
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -f scripts/fetch_macro_rates.py ]; then
            python scripts/fetch_macro_rates.py
          else
            echo "scripts/fetch_macro_rates.py not found — skipping"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "Groundwork Engine Bot"
          git config user.email "bot@gworky.com"
          git add -A public/data/ || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): auto-update macro rates [skip ci]"
            git push origin main
          fi
