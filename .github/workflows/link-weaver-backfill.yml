name: Link Weaver Backfill — Daily Systematic

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC, after Content Pipeline 03:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r agents/requirements.txt httpx
      - name: Backfill missing Groundwork/entity links
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 << 'PY'
          import os, re, httpx, sys
          sys.path.insert(0, ".")
          from agents.link_weaver import weave_article_links
          url=os.environ["NEXT_PUBLIC_SUPABASE_URL"]
          key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          h={"apikey":key,"Authorization":f"Bearer {key}", "Content-Type":"application/json"}
          # Find 20 oldest with 0 gworky links (orphan)
          r=httpx.get(f"{url}/rest/v1/articles?select=id,slug,pillar,title,content&status=eq.published&order=published_at.desc&limit=30", headers={"apikey":key,"Authorization":f"Bearer {key}"}, timeout=15)
          data=r.json()
          fixed=0
          for a in data:
              if "[Groundwork](https://gworky.com" in a['content']:
                  continue
              r2=httpx.get(f"{url}/rest/v1/articles?select=title,slug,pillar&status=eq.published&pillar=eq.{a['pillar']}&limit=5", headers={"apikey":key,"Authorization":f"Bearer {key}"}, timeout=10)
              sibs=r2.json() if r2.status_code==200 else []
              new=weave_article_links(a['content'], a['title'], a['pillar'], sibs)
              if new!=a['content']:
                  httpx.patch(f"{url}/rest/v1/articles?id=eq.{a['id']}", headers=h, json={"content":new}, timeout=10)
                  fixed+=1
                  print(f"fixed {a['slug']}")
          print(f"backfill done {fixed}")
          PY
