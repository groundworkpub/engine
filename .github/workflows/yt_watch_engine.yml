name: "YouTube Watch-Time Booster & Shorts Loop Engine"

on:
  schedule:
    # 24/7 Cloud Autonomy: Runs every 3 hours across 6 parallel shards (~144 Watch-Hours / day)
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Number of parallel workers per runner"
        required: false
        default: "2"
      watch_duration:
        description: "Watch time duration in seconds (e.g. 600 for 10m, 1200 for 20m)"
        required: false
        default: "1200"
      funnel_mode:
        description: "Discovery funnel mode"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "search"
          - "embed"
          - "shorts_bridge"
          - "direct"

jobs:
  watch-booster:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        runner_shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout Engine Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests pillow supabase httpx
          playwright install --with-deps chromium

      - name: Run YouTube Watch-Time Booster (Multi-Source Funnel, 144p, AI Cognitive Synthesis)
        env:
          DATAIMPULSE_HOST: ${{ secrets.DATAIMPULSE_HOST }}
          DATAIMPULSE_LOGIN: ${{ secrets.DATAIMPULSE_LOGIN }}
          DATAIMPULSE_PASSWORD: ${{ secrets.DATAIMPULSE_PASSWORD }}
          DATAIMPULSE_PORT: ${{ secrets.DATAIMPULSE_PORT }}
          TEXTBEE_API_KEY: ${{ secrets.TEXTBEE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_FOUNDER_CHAT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 Shard ${{ matrix.runner_shard }}: Starting Omni-Automation Watch Engine on GitHub Actions ($0 Free Tier)..."
          python master_orchestrator.py auto \
            --concurrency ${{ github.event.inputs.concurrency || 2 }} \
            --watch-duration ${{ github.event.inputs.watch_duration || 1200 }}
