name: Link Watch

on:
  workflow_dispatch:

concurrency:
  group: link-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan-mentions:
    name: Discover & triage brand mentions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Link Watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ALERTS_RSS_URL: ${{ secrets.GOOGLE_ALERTS_RSS_URL }}
          EXTRA_MENTION_FEEDS: ${{ secrets.EXTRA_MENTION_FEEDS }}
        run: PYTHONPATH=. python agents/link_watch.py
