name: Link Watch

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC — ACQUIRE weekly (F1 T-0008)
  workflow_dispatch:

concurrency:
  group: link-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan-mentions:
    name: Discover & triage brand mentions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run Link Watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ALERTS_RSS_URL: ${{ secrets.GOOGLE_ALERTS_RSS_URL }}
          EXTRA_MENTION_FEEDS: ${{ secrets.EXTRA_MENTION_FEEDS }}
        run: PYTHONPATH=. python agents/link_watch.py
