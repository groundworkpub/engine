[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "G"]
# BLE001: broad `except Exception` is intentional at pipeline boundaries
# B017: test raises broad Exception deliberately to assert validation
# B024: abstract-method warnings on pydantic models (false positives)
# B008: function call in default args is a pydantic pattern
# G004: codebase convention uses f-string logging throughout the pipeline
# E501: line length — long lines are URLs, prompts, and SQL strings where splitting hurts readability
ignore = ["BLE001", "B017", "B024", "B008", "G004", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
# scribe.py contains long prompt strings that are intentionally descriptive
"scribe.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["agents/tests"]
addopts = "-q"

[tool.pyright]
include = [
  "scouter.py",
  "critic.py",
  "scribe.py",
  "herald.py",
  "keyword_scout.py",
  "keyword_graph.py",
  "pipeline.py",
  "metabolism.py",
  "media_uploader.py",
  "broadcaster.py"
]
exclude = [".venv"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
extraPaths = [".."]
venvPath = "."
venv = ".venv"
reportMissingImports = false
reportMissingModuleSource = false

